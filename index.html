<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>假期安排</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-block">
          <img src="assets/logo.svg" alt="" class="brand-logo" />
          <div><h1>假期安排</h1><p id="data-status">已载入 2026 年官方安排</p></div>
        </div>
        <div id="calendar-navigation" class="month-nav" aria-label="月份导航">
          <button id="prev-month" class="icon-button" type="button" title="上个月" aria-label="上个月">‹</button>
          <button id="today-button" class="text-button" type="button">今天</button>
          <strong id="month-title"></strong>
          <button id="next-month" class="icon-button" type="button" title="下个月" aria-label="下个月">›</button>
        </div>
        <div class="header-actions">
          <button id="add-adjustment" class="primary-button" type="button">调班</button>
          <button id="add-date" class="text-button" type="button">维护日期</button>
          <button id="settings-toggle" class="text-button" type="button" aria-controls="settings-view" aria-expanded="false">设置</button>
        </div>
      </header>

      <section id="summary-band" class="summary-band" aria-label="本月统计">
        <div class="summary-item balance rest-balance"><span>缺班</span><strong id="summary-rest-balance">0</strong><small>天</small></div>
        <div class="summary-item balance work-balance"><span>未休</span><strong id="summary-work-balance">0</strong><small>天</small></div>
        <div class="summary-item"><span>本月休息</span><strong id="summary-rest">0</strong><small>天</small></div>
        <div class="summary-item pure"><span>放假</span><strong id="summary-pure">0</strong><small>天</small></div>
        <div class="summary-item"><span>休息</span><strong id="summary-schedule">0</strong><small>天</small></div>
      </section>

      <main id="calendar-view" class="workspace">
        <section class="calendar-panel">
          <div class="legend" aria-label="日历图例">
            <span><i class="legend-dot pure-dot"></i>放假</span>
            <span><i class="legend-dot arranged-dot"></i>调休</span>
            <span><i class="legend-dot rest-dot"></i>休息</span>
            <span><i class="legend-dot manual-work-dot"></i>补班</span>
            <span><i class="legend-dot suggestion-dot"></i>法定调休</span>
            <span><i class="legend-dot work-dot"></i>法定补班</span>
          </div>
          <div class="calendar-stage">
            <button id="calendar-prev-month" class="calendar-side-button" type="button" title="上个月" aria-label="日历上个月">‹</button>
            <div class="calendar-board">
              <div id="weekday-header" class="weekday-header" aria-hidden="true">
                <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
              </div>
              <div id="calendar-grid" class="calendar-grid"></div>
            </div>
            <button id="calendar-next-month" class="calendar-side-button" type="button" title="下个月" aria-label="日历下个月">›</button>
          </div>
        </section>

        <section class="adjustment-panel panel-section">
          <div class="section-heading"><h2>调休与补班记录</h2><span id="adjustment-record-count" class="count-badge">0 条</span></div>
          <div id="adjustment-record-list" class="adjustment-list"></div>
        </section>

        <aside class="result-panel">
          <section class="panel-section">
            <div class="section-heading"><h2><span id="result-year"></span> 放假</h2><span id="year-pure-count" class="count-badge">0 天</span></div>
            <div id="pure-holiday-list" class="holiday-list"></div>
          </section>
          <section id="expired-holiday-section" class="panel-section expired-section" hidden>
            <div class="section-heading"><h2>已过期假期</h2><span id="expired-holiday-count" class="count-badge muted">0 天</span></div>
            <div id="expired-holiday-list" class="holiday-list compact"></div>
          </section>
        </aside>
      </main>

      <main id="settings-view" class="settings-view" hidden>
        <div class="settings-content">
          <div class="settings-page-heading">
            <div><span class="eyebrow">偏好设置</span><h2>假期计算设置</h2></div>
          </div>
          <nav class="settings-toc" aria-label="设置目录">
            <a href="#weekend-settings">周末设置</a>
            <a href="#holiday-data-settings">节假日数据</a>
          </nav>

          <div class="settings-panel">
            <section id="weekend-settings" class="settings-group">
              <h3>周末设置</h3>
              <label class="field-label" for="week-starts-on">每周开始于</label>
              <select id="week-starts-on">
                <option value="6">周日</option>
                <option value="0">周一</option>
                <option value="1">周二</option>
                <option value="2">周三</option>
                <option value="3">周四</option>
                <option value="4">周五</option>
                <option value="5">周六</option>
              </select>
              <label class="field-label" for="anchor-monday">配置起始周一</label>
              <input id="anchor-monday" type="date" required />
              <span class="field-label">周末预设</span>
              <div id="weekend-preset" class="segmented-control preset-control">
                <button type="button" data-value="double">双休</button>
                <button type="button" data-value="single">单休</button>
                <button type="button" data-value="alternating">大小休</button>
              </div>
              <fieldset class="weekend-period-settings">
                <legend>周末自定义</legend>
                <div class="weekend-period-row" data-weekend-day="5">
                  <span>周六</span>
                  <div class="segmented-control weekend-period-control">
                    <button type="button" data-value="full">全天</button>
                    <button type="button" data-value="am">上午</button>
                    <button type="button" data-value="pm">下午</button>
                  </div>
                  <label class="repeat-field">间隔（周）<input class="weekend-repeat-interval" type="number" min="0" max="52" step="1" value="0" /></label>
                </div>
                <div class="weekend-period-row" data-weekend-day="6">
                  <span>周日</span>
                  <div class="segmented-control weekend-period-control">
                    <button type="button" data-value="full">全天</button>
                    <button type="button" data-value="am">上午</button>
                    <button type="button" data-value="pm">下午</button>
                  </div>
                  <label class="repeat-field">间隔（周）<input class="weekend-repeat-interval" type="number" min="0" max="52" step="1" value="0" /></label>
                </div>
              </fieldset>
            </section>

            <section id="holiday-data-settings" class="settings-group data-actions">
              <h3>节假日数据</h3>
              <div class="button-row">
                <button id="import-data" class="secondary-button" type="button">导入</button>
                <button id="export-data" class="secondary-button" type="button">导出</button>
              </div>
              <button id="reset-data" class="quiet-button" type="button">恢复内置 2026 数据</button>
              <input id="import-file" type="file" accept="application/json,.json" hidden />
            </section>
          </div>
        </div>
      </main>
    </div>

    <dialog id="date-dialog">
      <form method="dialog" id="date-form">
        <div class="dialog-heading">
          <div><span class="eyebrow">日期修正</span><h2 id="dialog-date-title"></h2></div>
          <button class="icon-button" value="cancel" type="submit" title="关闭" aria-label="关闭">×</button>
        </div>
        <label class="field-label" for="edit-date">日期</label>
        <input id="edit-date" type="date" required />
        <label class="field-label" for="edit-kind">类型</label>
        <select id="edit-kind">
          <option value="">无官方安排</option>
          <option value="legal">放假</option>
          <option value="off">周末 / 调休</option>
          <option value="work">法定补班</option>
        </select>
        <label class="field-label" for="edit-name">名称</label>
        <input id="edit-name" type="text" maxlength="30" placeholder="例如：国庆节" />
        <div id="date-preview" class="date-preview"></div>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel" type="submit">取消</button>
          <button id="save-date" class="primary-button" value="default" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="adjustment-dialog">
      <form method="dialog" id="adjustment-form">
        <div class="dialog-heading">
          <div><span class="eyebrow">调休补班</span><h2 id="adjustment-dialog-title">发起调休</h2></div>
          <button class="icon-button" value="cancel" type="submit" title="关闭" aria-label="关闭">×</button>
        </div>
        <span class="field-label">类型</span>
        <div id="adjustment-type" class="segmented-control">
          <button type="button" data-value="rest">调休</button>
          <button type="button" data-value="work">补班</button>
        </div>
        <div class="time-range-grid">
          <div>
            <label class="field-label" for="adjustment-start-date">开始日期</label>
            <input id="adjustment-start-date" type="date" required />
          </div>
          <div>
            <label class="field-label" for="adjustment-start-period">开始时段</label>
            <select id="adjustment-start-period">
              <option value="am">上午</option>
              <option value="pm">下午</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="adjustment-end-date">结束日期</label>
            <input id="adjustment-end-date" type="date" required />
          </div>
          <div>
            <label class="field-label" for="adjustment-end-period">结束时段</label>
            <select id="adjustment-end-period">
              <option value="am">上午</option>
              <option value="pm">下午</option>
            </select>
          </div>
        </div>
        <label class="field-label" for="adjustment-note">备注</label>
        <input id="adjustment-note" type="text" maxlength="30" placeholder="可选" />
        <div id="adjustment-preview" class="date-preview"></div>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel" type="submit">取消</button>
          <button id="save-adjustment" class="primary-button" value="default" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
